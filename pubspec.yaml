name: bisho_top
description: "Bisho Top - Social & Entertainment App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # إدارة الحالة والمسارات
  get: ^4.6.6

  # خدمات Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1

  # الوسائط والملفات
  video_player: ^2.8.0
  image_picker: ^1.1.0
  share_plus: ^9.0.0

  # الأيقونات والتصميم
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
